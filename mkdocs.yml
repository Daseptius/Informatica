site_name: Mis Apuntes de Informática
theme:
  name: material
  language: es
  palette:
    # Modo oscuro automático (cambia según el sistema)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
