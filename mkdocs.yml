site_name: Informatica
theme:
  name: material
  language: es
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

nav:
  - Home: index.md
  - Máquinas Virtuales:
      - Guía de conexión SSH: guia-ssh.md
  - Linux:
      - Fundamentos de la Línea de Comandos: guia_linea_de_comandos_linux.md
  - Python:
      - Guía Completa de Python: python.md
